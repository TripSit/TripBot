kind: pipeline
type: docker
name: Deploy TripBot

# The signed hook delegates checkout/build to the production server.
clone:
  disable: true

node:
  env: prod

steps:
  - name: Rebuild TripBot
    # The server rebuilds and restarts this itself (docker/deploy/ on the server); this step only asks it to.
    # This step requests only its hook key; runner-wide host mounts/socket access must also be removed at cutover.
    image: local/tripsit-deploy-client:1-20261104
    pull: never
    environment:
      DEPLOY_HOOK_SECRET:
        from_secret: DEPLOY_HOOK_SECRET
    commands:
      - |
        set -eu
        [ "$DRONE_COMMIT_BRANCH" = main ] || { echo "Refusing non-main production deployment" >&2; exit 1; }
        [ "$DRONE_BUILD_EVENT" = push ] || { echo "Refusing non-push production deployment" >&2; exit 1; }
        BODY=$(printf '{"target":"tripbot","build":"%s","sha":"%s","ts":"%s"}' "$DRONE_BUILD_NUMBER" "$DRONE_COMMIT_SHA" "$(date +%s)")
        SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$DEPLOY_HOOK_SECRET" | sed 's/^.* //')
        if HTTP_STATUS=$(curl -sS --connect-timeout 10 --max-time 3000 --retry 0 \
          -o deploy.log -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
          -H "X-Signature: sha256=$SIG" --data-binary "$BODY" http://deployer:9000/hooks/deploy-tripbot); then
          :
        else
          RC=$?
          echo "Deploy request failed (curl exit $RC); server may still be running it. No retry performed." >&2
          exit "$RC"
        fi
        cat deploy.log
        [ "$HTTP_STATUS" = 200 ] || { echo "Deploy hook HTTP $HTTP_STATUS" >&2; exit 1; }
        grep -qx 'DEPLOY_RESULT=success' deploy.log
        grep -qx "DEPLOY_COMMIT=$DRONE_COMMIT_SHA" deploy.log

  - name: discord notification
    image: appleboy/drone-discord:1.5.2@sha256:c850372e85a4b86465e8fa89876fe86263f7b1979f1f0c8d51243b78b792155c
    when:
      status: [success, failure]
    settings:
      webhook_id: 
        from_secret: WEBHOOK_ID
      webhook_token:
        from_secret: WEBHOOK_TOKEN
      avatar_url: https://i.imgur.com/tnw3I34.png
      username: 'Drone CI'
      message: |
        {{#success build.status}}
        Build {{build.number}} succeeded.
        {{else}}
        Build {{build.number}} failed.
        {{/success}}
        Build time: {{build.started}}
        Commit message: {{truncate commit.message 500}}
        Commit author: {{commit.author}}
        Commit branch: {{commit.branch}}
        {{#success build.status}}
        View logs: <{{build.link}}>
        {{else}}
        View failed job: <{{build.link}}>
        {{/success}}

trigger:
  branch:
  - main
  event:
  # - cron
  - push
  # - pull_request
  # - tag
  # - promote
  # - rollback

---
kind: pipeline
type: docker
name: Deploy TripBot UAT

node:
  env: uat

steps:
  - name: Rebuild TripBot UAT
    image: docker
    commands:
      - apk update
      - apk upgrade
      - apk add --no-cache git
      - cat docker-compose.host.yml
      - docker compose -f docker-compose.host.yml --project-name tripbot up tripbot -d --force-recreate --build --no-deps
    environment:
      NODE_ENV:
        from_secret: NODE_ENV
      DOCKER_HOST:
        from_secret: DOCKER_HOST
      DOCKER_BUILDKIT:
        from_secret: DOCKER_BUILDKIT
      DISCORD_CLIENT_ID:
        from_secret: DISCORD_CLIENT_ID
      DISCORD_CLIENT_TOKEN:
        from_secret: DISCORD_CLIENT_TOKEN
      DISCORD_GUILD_ID:
        from_secret: DISCORD_GUILD_ID
      DISCORD_OWNER_ID:
        from_secret: DISCORD_OWNER_ID
      DRONE_TOKEN:
        from_secret: DRONE_TOKEN
      DISCORD_CLIENT_SECRET:
        from_secret: DISCORD_CLIENT_SECRET
      DISCORD_CLIENT_REDIRECT_URI:
        from_secret: DISCORD_CLIENT_REDIRECT_URI
      GITHUB_TOKEN:
        from_secret: GITHUB_TOKEN
      GLITCHTIP_DSN:
        from_secret: GLITCHTIP_DSN
      RAPID_TOKEN:
        from_secret: RAPID_TOKEN
      ROLLBAR_TOKEN:
        from_secret: ROLLBAR_TOKEN
      IMGUR_ID:
        from_secret: IMGUR_ID
      IMGUR_SECRET:
        from_secret: IMGUR_SECRET
      YOUTUBE_TOKEN:
        from_secret: YOUTUBE_TOKEN
      MATRIX_BOT_PASSWORD:
        from_secret: MATRIX_BOT_PASSWORD
      MOODLE_TOKEN:
        from_secret: MOODLE_TOKEN
      GEMINI_KEY:
        from_secret: GEMINI_KEY
      REVOLT_BOT_TOKEN:
        from_secret: REVOLT_BOT_TOKEN
      WOLFRAM_TOKEN:
        from_secret: WOLFRAM_TOKEN
      IMDB_TOKEN:
        from_secret: IMDB_TOKEN
      SENTRY_TOKEN:
        from_secret: SENTRY_TOKEN
      MODERATE_HATESPEECH_TOKEN:
        from_secret: MODERATE_HATESPEECH_TOKEN
      TRIPBOT_API_URL:
        from_secret: TRIPBOT_API_URL
      TRIPBOT_API_TOKEN:
        from_secret: TRIPBOT_API_TOKEN
      KEYCLOAK_BASE_URL:
        from_secret: KEYCLOAK_BASE_URL
      KEYCLOAK_REALM:
        from_secret: KEYCLOAK_REALM
      KEYCLOAK_CLIENT_ID:
        from_secret: KEYCLOAK_CLIENT_ID
      KEYCLOAK_CLIENT_SECRET:
        from_secret: KEYCLOAK_CLIENT_SECRET

  - name: discord notification
    image: appleboy/drone-discord
    settings:
      webhook_id:
        from_secret: WEBHOOK_ID
      webhook_token:
        from_secret: WEBHOOK_TOKEN
      avatar_url: https://i.imgur.com/tnw3I34.png
      username: 'Drone CI'
      message: |
        {{#success build.status}}
        UAT build {{build.number}} succeeded.
        {{else}}
        UAT build {{build.number}} failed.
        {{/success}}
        Build time: {{build.started}}
        Commit message: {{truncate commit.message 500}}
        Commit author: {{commit.author}}
        Commit branch: {{commit.branch}}
        {{#success build.status}}
        View logs: <{{build.link}}>
        {{else}}
        View failed job: <{{build.link}}>
        {{/success}}

trigger:
  branch:
  - uat
  event:
  - custom
  - push