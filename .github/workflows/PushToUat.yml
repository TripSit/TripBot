name: PushToUat

on:
  push:
    branches:
      - uat
    paths-ignore:
      - "**/archive/**"
      - "**/legacy/**"
      - "**/matrix/**"
      - "**/telegram/**"
      - "**/build/**"
      - "**/@prisma-moodle/**"
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=7168
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Update npm
        run: npm install -g npm && npm --version
      - name: Install eslint
        run: npm install eslint eslint-config-airbnb-base eslint-config-airbnb-typescript eslint-config-google eslint-import-resolver-typescript eslint-plugin-import --save-dev --legacy-peer-deps && npx eslint --version
      - name: Linting
        run: npx eslint --ext .ts,.js .
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=7168
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma clients
        run: npm run db:generate
      - name: Type check
        run: npx tsc --noEmit
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=7168
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma clients
        run: npm run db:generate
      - name: Copy env
        run: cp .env.example .env
      - name: Test
        run: npx vitest run --silent --coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 1
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build tripbot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/docker/Dockerfile.tripbot
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: javascript
      - name: Autobuild
        uses: github/codeql-action/autobuild@v2
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        with:
          category: "/language:javascript"
  sonar:
    needs: test
    name: SonarScan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      # The scanner needs the dependency and generated Prisma types to resolve types in the analysis
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma clients
        run: npm run db:generate
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage
      - name: Verify coverage report
        run: test -s coverage/lcov.info
      - uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
