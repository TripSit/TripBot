name: PullRequestOpen

on:
  pull_request:
    branches:
      - main
      - uat
    types:
      - opened
      - synchronize
      - reopened

# A PR just opened against uat may be behind uat; sync-with-uat pushes a merge
# commit to bring it current, which fires a fresh `synchronize` run with the
# updated code. This cancels the now-stale run from `opened` instead of
# letting both finish (checks can't be re-run mid-workflow against a branch
# update - the checkout ref is fixed at trigger time - so superseding the
# whole run is the only way to actually check the synced code).
permissions:
  contents: read

concurrency:
  group: pr-open-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync-with-uat:
    name: Sync PR with uat
    runs-on: ubuntu-latest
    if: github.event.action == 'opened' && github.event.pull_request.base.ref == 'uat'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Update this PR's branch with the latest uat
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api -X PUT "repos/${GH_REPO}/pulls/${{ github.event.pull_request.number }}/update-branch" \
            || echo "::warning::Could not auto-sync this PR with uat (likely a real conflict or a fork branch) - it may need a manual update."
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=7168
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Update npm
        run: npm install -g npm && npm --version
      - name: Install eslint
        run: npm install eslint @typescript-eslint/eslint-plugin @typescript-eslint/parser eslint-config-airbnb-base eslint-config-airbnb-typescript eslint-config-google eslint-import-resolver-typescript eslint-plugin-import eslint-plugin-sonarjs --save-dev --legacy-peer-deps && npx eslint --version
      - name: Linting
        run: npx eslint --ext .ts,.js .
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=7168
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma clients
        run: npm run db:generate
      - name: Type check
        run: npx tsc --noEmit
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=7168
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma clients
        run: npm run db:generate
      - name: Copy env
        run: cp .env.example .env
      - name: Test
        run: npx vitest run --silent --coverage --reporter=json --outputFile=jest-results.json
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-results
          path: jest-results.json
          retention-days: 1
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 1
  sonar:
    # Runs the same scan and quality gate as the post-merge PushToUat job, so a Sonar failure blocks the PR
    # instead of showing up after the merge. Secrets are not available to PRs from forks, so those skip it.
    name: SonarScan
    needs: test
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      # The scanner needs the dependency and generated Prisma types to resolve types in the analysis
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma clients
        run: npm run db:generate
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage
      - name: Verify coverage report
        run: test -s coverage/lcov.info
      - uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.event.pull_request.head.ref }}
            -Dsonar.pullrequest.base=${{ github.event.pull_request.base.ref }}
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build tripbot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/docker/Dockerfile.tripbot
          push: false
          load: true
          tags: tripbot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test PM2 runtime as the image user
        run: |
          docker run --rm --network none --entrypoint node \
            --mount "type=bind,source=${{ github.workspace }}/src/docker/tests/pm2.smoke.js,target=/tmp/pm2.smoke.js,readonly" \
            tripbot:ci /tmp/pm2.smoke.js
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: javascript
      - name: Autobuild
        uses: github/codeql-action/autobuild@v2
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        with:
          category: "/language:javascript"
