name: PullRequestOpen

on:
  pull_request:
    branches:
      - main
      - uat
    types:
      - opened
      - synchronize
      - reopened
    paths-ignore:
      - "**/archive/**"
      - "**/legacy/**"
      - "**/matrix/**"
      - "**/telegram/**"
      - "**/irc/**"
      - "**/jest/**"
      - "**/build/**"
      - "**/@prisma-moodle/**"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=7168
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Update npm
        run: npm install -g npm && npm --version
      - name: Install eslint
        run: npm install eslint @typescript-eslint/eslint-plugin @typescript-eslint/parser eslint-config-airbnb-base eslint-config-airbnb-typescript eslint-config-google eslint-import-resolver-typescript eslint-plugin-import eslint-plugin-jest eslint-plugin-sonarjs --save-dev --legacy-peer-deps && npx eslint --version
      - name: Linting
        run: npx eslint --ext .ts,.js .
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=7168
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma clients
        run: npm run db:generate
      - name: Type check
        run: npx tsc --noEmit
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=7168
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma clients
        run: npm run db:generate
      - name: Copy env
        run: cp .env.example .env
      - name: Test
        run: npx jest --silent -c ./src/jest/jest.config.ts --json --outputFile=jest-results.json
      - name: Notify TripBot of new PR
        if: always() && github.event.action == 'opened'
        env:
          TRIPBOT_API_URL: ${{ secrets.TRIPBOT_API_URL }}
          TRIPBOT_API_TOKEN: ${{ secrets.TRIPBOT_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          node -e "
            const fs = require('fs');
            let passed = 0;
            let total = 0;
            try {
              const results = JSON.parse(fs.readFileSync('jest-results.json', 'utf8'));
              passed = results.numPassedTests;
              total = results.numTotalTests;
            } catch (err) {
              console.error('Could not read jest results:', err.message);
            }
            fs.writeFileSync('pr-notify-payload.json', JSON.stringify({
              number: Number(process.env.PR_NUMBER),
              title: process.env.PR_TITLE,
              body: process.env.PR_BODY,
              url: process.env.PR_URL,
              author: process.env.PR_AUTHOR,
              testsPassed: passed,
              testsTotal: total,
            }));
          "
          curl -sf -X POST "$TRIPBOT_API_URL/pr/notify" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TRIPBOT_API_TOKEN" \
            --data @pr-notify-payload.json
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build tripbot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/docker/Dockerfile.tripbot
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: javascript
      - name: Autobuild
        uses: github/codeql-action/autobuild@v2
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        with:
          category: "/language:javascript"
