name: PullRequestOpen

on:
  pull_request:
    branches:
      - main
      - uat
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited

  merge_group:
    types: [checks_requested]
    branches: [uat]

permissions:
  contents: read

concurrency:
  group: pr-open-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=7168
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Linting
        run: npx eslint --ext .ts,.js .
      - name: Lint delivery controls
        env:
          ESLINT_USE_FLAT_CONFIG: "true"
        run: npx eslint --no-ignore --config .github/scripts/eslint.config.mjs .github/scripts/*.cjs .github/scripts/*.mjs
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=7168
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma clients
        run: npm run db:generate
      - name: Type check
        run: npx tsc --noEmit
      - name: Type check tests
        run: npx tsc --noEmit --project tsconfig.vitest.json
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=7168
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma clients
        run: npm run db:generate
      - name: Copy env
        run: cp .env.example .env
      - name: Test
        run: npx vitest run --silent --coverage --reporter=json --outputFile=jest-results.json
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: jest-results
          path: jest-results.json
          retention-days: 1
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 1
  sonar:
    needs: test
    name: SonarScan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      # The scanner needs the dependency and generated Prisma types to resolve types in the analysis
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma clients
        run: npm run db:generate
      - name: Download coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: coverage
          path: coverage
      - name: Verify coverage report
        run: test -s coverage/lcov.info
      - uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build tripbot image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./src/docker/Dockerfile.tripbot
          push: false
          load: true
          tags: tripbot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test PM2 runtime as the image user
        run: |
          docker run --rm --network none --entrypoint node \
            --mount "type=bind,source=${{ github.workspace }}/src/docker/tests/pm2.smoke.js,target=/tmp/pm2.smoke.js,readonly" \
            tripbot:ci /tmp/pm2.smoke.js
      - name: Smoke-test native modules and Prisma clients in the image
        run: |
          docker run --rm --network none --entrypoint node \
            --mount "type=bind,source=${{ github.workspace }}/src/docker/tests/native.smoke.js,target=/tmp/native.smoke.js,readonly" \
            tripbot:ci /tmp/native.smoke.js | grep -qx NATIVE_SMOKE_OK
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934
        with:
          languages: javascript
      - name: Autobuild
        uses: github/codeql-action/autobuild@915412ff23e8b7659517e607487dbeae018f2934
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934
        with:
          category: "/language:javascript"

  release-policy-tests:
    name: Release policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - run: node --test .github/scripts/release-policy.test.mjs
      - run: python3 .github/scripts/configure-cicd.test.py

  ci-passed:
    name: CI Passed
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, build, test, sonar, docker-build, codeql, release-policy-tests]
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const r=JSON.parse(process.env.RESULTS); if(!Object.keys(r).length || Object.values(r).some(j=>j.result!=="success")) process.exit(1)'
