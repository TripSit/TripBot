name: PromoteUatToMain

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Record UAT deployment]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  actions: read
  deployments: read
  security-events: read

concurrency:
  group: promote-main
  cancel-in-progress: false

jobs:
  fast-forward:
    name: Promote verified UAT commit
    if: vars.CICD_PROMOTION_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    environment: production-promotion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Privileged jobs load only the trusted workflow revision, never a PR checkout.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/
            /.github/cicd.json
      - name: Create scoped promotion installation token
        id: promotion-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          app-id: ${{ vars.PROMOTION_APP_ID }}
          private-key: ${{ secrets.PROMOTION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PROMOTION_TOKEN: ${{ steps.promotion-token.outputs.token }}
        with:
          script: |
            const policy = require('./.github/scripts/release-policy.cjs');
            {
              const prs = await github.paginate(github.rest.pulls.list, {...context.repo,
                state: 'open', base: 'main', head: `${context.repo.owner}:uat`, per_page: 100});
              if (prs.length !== 1 || prs[0].head.repo?.full_name !== context.payload.repository.full_name) {
                core.info('No canonical promotion PR is ready.'); return;
              }
              const reviews = await github.paginate(github.rest.pulls.listReviews,
                {...context.repo, pull_number: prs[0].number, per_page: 100});
              let approvals;
              try {
                approvals = await policy.trustedApprovals(reviews, prs[0].head.sha, prs[0].user.login,
                  policy.client(github, context).permission);
              } catch (error) {
                core.info(`Waiting for an authorized current-commit sign-off: ${error.message}`); return;
              }
              const review = approvals[0];
              context.payload.pull_request = prs[0];
              context.payload.review = review;
            }
            await policy.promote({github, context, core});
